<title>Sportbox</title>
<meta name="description" content="Musculation à la maison : bibliothèque d'exercices Push/Pull/Legs, tirage automatique de la semaine, minuteurs de repos et suivi de progression.">
<meta name="theme-color" content="#14171b">
<link rel="manifest" href="manifest.json">

</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    /* Même DA que Cookbox (Loverbox, façon Letterboxd) : fond quasi noir, cartes ardoise, accents saturés */
    --bg:#14171b;
    --surface:#1b1f27;
    --surface-2:#212632;
    --line:rgba(255,255,255,0.09);
    --ink:#f3f4f6;
    --muted:#8a92a3;
    --muted-2:#666e7d;

    --green:#30cb75; --green-ink:#0b1f12;
    --orange:#f0923a; --orange-ink:#2b1503;
    --amber:#eab54e; --amber-ink:#2b2005;

    --push:var(--orange); --push-ink:var(--orange-ink);
    --pull:var(--amber); --pull-ink:var(--amber-ink);
    --legs:var(--green); --legs-ink:var(--green-ink);

    --shadow: 0 8px 20px -10px rgba(0,0,0,0.55);
    scroll-behavior:smooth;
  }

  *{ box-sizing:border-box; }
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-variant-numeric: tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-weight:800; text-wrap:balance; letter-spacing:-0.01em; }

  .shell{ max-width:640px; margin:0 auto; padding-inline:18px; padding-block: 18px 64px; }

  header.top{
    position:sticky; top: env(safe-area-inset-top, 0px); z-index:10;
    background:var(--bg); padding-block: 14px 10px; margin-inline: -18px; padding-inline: 18px;
    border-bottom:1px solid var(--line);
  }
  .title-row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .title-row h1{ font-size:1.7rem; font-weight:800; margin:0; color:var(--ink); }
  .title-row .kicker{ display:block; font-weight:600; font-size:0.72rem; color:var(--green); margin-bottom:3px; }
  .reset-btn{ border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:0.72rem; font-weight:600; padding:6px 11px; border-radius:8px; cursor:pointer; white-space:nowrap; font-family:inherit; }
  .reset-btn:hover{ color:var(--ink); border-color:var(--muted); }
  .reset-confirm{ display:flex; align-items:center; gap:8px; font-size:0.72rem; color:var(--muted); }
  .reset-confirm button{ border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:0.72rem; padding:5px 10px; border-radius:7px; cursor:pointer; font-family:inherit; font-weight:600; }
  .reset-confirm button.danger{ background:var(--orange); border-color:var(--orange); color:var(--orange-ink); }

  .tabs{ display:flex; gap:1px; }
  .tab-btn{
    flex:1; appearance:none; border:none; background:transparent; color:var(--muted);
    font-family:inherit; font-weight:600; font-size:0.72rem;
    padding:9px 1px 10px; border-bottom:3px solid transparent; cursor:pointer; text-align:center;
  }
  .tab-btn[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--green); }
  .tab-btn:focus-visible{ outline:2px solid var(--green); outline-offset:2px; }

  .panel{ padding-top:18px; }

  .lineup{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 15px 15px; margin-bottom:18px; box-shadow:var(--shadow); }
  .lineup h3{ font-size:0.9rem; margin:0 0 2px; font-weight:700; color:var(--ink); }
  .lineup .sub{ font-size:0.72rem; color:var(--muted); display:block; margin-bottom:11px; }
  .lineup-pills{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .lineup-pill{ font-size:0.74rem; font-weight:600; background:var(--surface-2); border:1px solid var(--line); padding:5px 10px; border-radius:99px; color:var(--ink); display:inline-flex; align-items:center; gap:5px; }
  .lineup-pill .dot{ width:7px;height:7px;border-radius:99px;background:var(--muted-2); }
  .lineup-pill.done .dot{ background:var(--green); }
  .lineup-pill.done{ color:var(--muted); }
  .reroll-btn{
    border:none; background:var(--green); color:var(--green-ink); font-size:0.78rem; font-weight:700;
    padding:9px 15px; border-radius:10px; cursor:pointer; font-family:inherit; transition:transform .15s ease;
  }
  .reroll-btn:hover{ transform:scale(1.03); }
  .notif-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .notif-label{ font-size:0.78rem; color:var(--muted); font-weight:600; }
  .swap-btn[disabled]{ cursor:default; opacity:0.7; }

  .week-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .week-header h2{ font-size:1.2rem; font-weight:800; margin:0 0 2px; color:var(--ink); }
  .week-header .theme{ font-size:0.8rem; font-weight:600; }
  .theme-push{ color:var(--push); } .theme-pull{ color:var(--pull); } .theme-legs{ color:var(--legs); }
  .swap-btn{
    flex:none; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:0.7rem; font-weight:600;
    padding:5px 11px; border-radius:8px; cursor:pointer; white-space:nowrap; font-family:inherit; margin-top:2px;
  }
  .swap-btn:hover{ color:var(--ink); border-color:var(--muted); }

  .quicknav{ display:flex; gap:6px; flex-wrap:wrap; margin:12px 0 20px; }
  .quicknav a{ font-size:0.72rem; font-weight:600; color:var(--muted); background:var(--surface); border:1px solid var(--line); padding:4px 11px; border-radius:99px; text-decoration:none; }
  .quicknav a:hover{ color:var(--green); border-color:var(--green); }
  .week-section{ scroll-margin-top: 100px; margin-bottom: 26px; }
  .week-section:last-child{ margin-bottom:0; }

  .progress{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .progress-track{ flex:1; height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .progress-fill{ height:100%; border-radius:99px; width:0%; transition:width .25s ease; }
  .fill-push{ background:var(--push); }
  .fill-pull{ background:var(--pull); }
  .fill-legs{ background:var(--legs); }
  .progress-label{ font-size:0.72rem; color:var(--muted); font-weight:600; white-space:nowrap; }

  .section-title{ font-size:0.74rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--muted-2); margin: 0 0 8px; }
  .stock-cat{ margin: 20px 0 8px; }
  .stock-cat:first-child{ margin-top:0; }

  .list{ display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); }
  .item{ display:flex; align-items:center; gap:11px; padding:11px 13px; border-bottom:1px solid var(--line); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .item:last-child{ border-bottom:none; }
  .item input{ position:absolute; opacity:0; width:1px;height:1px; }
  .box{ flex:none; width:19px;height:19px; border-radius:99px; border:2px solid var(--muted-2); background:transparent; display:flex; align-items:center; justify-content:center; color:var(--push-ink); }
  .box svg{ width:12px;height:12px; opacity:0; transform:scale(.6); transition:opacity .12s, transform .12s; }
  .item input:checked + .box{ background:var(--push); border-color:var(--push); color:var(--push-ink); }
  .item input:checked + .box svg{ opacity:1; transform:scale(1); }
  .list.prep-check.cat-push .item input:checked + .box{ background:var(--push); border-color:var(--push); color:var(--push-ink); }
  .list.prep-check.cat-pull .item input:checked + .box{ background:var(--pull); border-color:var(--pull); color:var(--pull-ink); }
  .list.prep-check.cat-legs .item input:checked + .box{ background:var(--legs); border-color:var(--legs); color:var(--legs-ink); }
  .item input:focus-visible + .box{ outline:2px solid var(--green); outline-offset:2px; }
  .item .text{ font-size:0.9rem; line-height:1.35; color:var(--ink); }
  .item input:checked ~ .text{ color:var(--muted); text-decoration:line-through; text-decoration-thickness:1px; }
  .item .note{ display:block; font-size:0.76rem; color:var(--muted); margin-top:1px; }

  .step{ padding:13px 13px 14px; border-bottom:1px solid var(--line); }
  .step:last-child{ border-bottom:none; }
  .step-head{ display:flex; align-items:flex-start; gap:11px; }
  .step-num{ flex:none; width:24px;height:24px; border-radius:7px; background:var(--surface-2); border:1px solid var(--line); display:flex;align-items:center;justify-content:center; font-size:0.7rem; font-weight:700; color:var(--muted); margin-top:1px; }
  .step-body{ flex:1; min-width:0; }
  .step-tag{ display:inline-block; font-size:0.66rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; margin-bottom:3px; }
  .cat-push .step-tag{ color:var(--push); } .cat-pull .step-tag{ color:var(--pull); } .cat-legs .step-tag{ color:var(--legs); }
  .step-text{ font-size:0.9rem; line-height:1.4; color:var(--ink); font-weight:600; }
  .step-note{ font-size:0.82rem; line-height:1.4; color:var(--muted); margin-top:2px; }
  .step.done .step-text{ color:var(--muted); }
  .cat-push .step.done .step-num{ background:var(--push); border-color:var(--push); color:var(--push-ink); }
  .cat-pull .step.done .step-num{ background:var(--pull); border-color:var(--pull); color:var(--pull-ink); }
  .cat-legs .step.done .step-num{ background:var(--legs); border-color:var(--legs); color:var(--legs-ink); }

  .timer{ display:flex; align-items:center; gap:8px; margin-top:9px; }
  .timer-display{ font-weight:700; font-size:0.82rem; min-width:3.6em; color:var(--ink); }
  .timer.done .timer-display{ color:var(--orange); }
  .timer-btn{ border:1px solid var(--line); background:var(--surface-2); color:var(--ink); font-size:0.72rem; font-weight:700; padding:5px 12px; border-radius:8px; cursor:pointer; font-family:inherit; }
  .timer-btn.ghost{ background:transparent; color:var(--muted); font-weight:500; padding:5px 8px; }
  .timer.running .timer-btn[data-action="toggle"]{ background:var(--amber); border-color:var(--amber); color:var(--amber-ink); }

  .log-row{ display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .log-field{ display:flex; align-items:center; gap:5px; font-size:0.76rem; color:var(--muted); font-weight:600; }
  .log-field input{ width:52px; font-family:inherit; font-size:0.85rem; font-weight:700; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:5px 7px; text-align:center; }
  .log-field input:focus-visible{ outline:2px solid var(--green); outline-offset:1px; }
  .log-prev{ font-size:0.74rem; color:var(--muted-2); width:100%; margin-top:2px; }

  .step-check{ flex:none; align-self:flex-start; }

  .cards{ display:flex; flex-direction:column; gap:12px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 15px 15px; box-shadow:var(--shadow); }
  .card h3{ font-size:1.05rem; font-weight:800; margin:0 0 8px; color:var(--ink); }
  .tags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:9px; }
  .tag{ font-size:0.7rem; font-weight:600; background:rgba(48,203,117,0.14); color:var(--green); padding:3px 9px; border-radius:99px; }
  .card p{ font-size:0.85rem; line-height:1.45; margin:0; color:var(--ink); }

  .callout{ background:var(--surface-2); border:1px solid var(--line); border-left:3px solid var(--orange); border-radius:10px; padding:11px 13px; font-size:0.83rem; line-height:1.5; margin-top: 10px; color:var(--ink); }
  .callout:first-child{ margin-top:0; }
  .callout b{ color:var(--orange); }
  .callout.turm{ border-left-color:var(--amber); }
  .callout.turm b{ color:var(--amber); }

  .lib-list{ display:flex; flex-direction:column; gap:10px; }
  .lib-item{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; box-shadow:var(--shadow); }
  .lib-item.active{ border-color:var(--green); }
  .lib-main{ min-width:0; }
  .lib-name{ font-weight:700; font-size:0.95rem; margin-bottom:5px; color:var(--ink); }
  .lib-target{ font-size:0.78rem; color:var(--muted); margin-bottom:4px; }
  .lib-note{ font-size:0.8rem; color:var(--muted); line-height:1.4; }
  .lib-badge{ flex:none; font-size:0.66rem; font-weight:700; color:var(--green-ink); background:var(--green); padding:4px 10px; border-radius:99px; white-space:nowrap; }

  .weight-form{ display:flex; gap:8px; margin-bottom:16px; }
  .weight-form input{ flex:1; font-family:inherit; font-size:0.95rem; font-weight:700; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .weight-form input:focus-visible{ outline:2px solid var(--green); outline-offset:1px; }
  .weight-form button{ border:none; background:var(--green); color:var(--green-ink); font-size:0.85rem; font-weight:700; padding:0 16px; border-radius:10px; cursor:pointer; font-family:inherit; }
  .weight-row{ display:flex; align-items:center; gap:11px; padding:11px 13px; border-bottom:1px solid var(--line); }
  .weight-row:last-child{ border-bottom:none; }
  .weight-date{ flex:1; font-size:0.85rem; color:var(--ink); font-weight:600; }
  .weight-kg{ font-size:0.9rem; font-weight:700; color:var(--ink); }
  .weight-delta{ font-size:0.74rem; font-weight:700; min-width:3.4em; text-align:right; }
  .weight-delta.up{ color:var(--orange); } .weight-delta.down{ color:var(--green); } .weight-delta.flat{ color:var(--muted); }
  .weight-del{ flex:none; border:none; background:transparent; color:var(--muted-2); font-size:1rem; cursor:pointer; padding:2px 4px; line-height:1; }
  .weight-del:hover{ color:var(--orange); }
  .empty{ font-size:0.85rem; color:var(--muted); padding:16px 14px; text-align:center; }

  [hidden]{ display:none !important; }
</style>

<div class="shell">
  <header class="top">
    <div class="title-row">
      <div>
        <span class="kicker">Muscu maison · rotation Push/Pull/Legs</span>
        <h1>Sportbox</h1>
      </div>
      <div id="reset-zone">
        <button type="button" class="reset-btn" id="reset-open">Réinitialiser</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab-btn" role="tab" data-tab="poids" aria-selected="true">Poids</button>
      <button class="tab-btn" role="tab" data-tab="s1" aria-selected="false">S1</button>
      <button class="tab-btn" role="tab" data-tab="s2" aria-selected="false">S2</button>
      <button class="tab-btn" role="tab" data-tab="s3" aria-selected="false">S3</button>
      <button class="tab-btn" role="tab" data-tab="s4" aria-selected="false">S4</button>
      <button class="tab-btn" role="tab" data-tab="lib" aria-selected="false">Biblio</button>
    </nav>
  </header>

  <main id="app"></main>
</div>

<script>
(function(){
  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // ---------- exercise library ----------
  var CAT_LABEL = { push:'Push', pull:'Pull', legs:'Legs' };

  // sets/workSec servent uniquement à estimer la durée d'une séance (temps de travail par série, hors repos)
  var EXERCISES = {
    // -------- PUSH : poitrine, épaules, triceps --------
    'push-classique': { cat:'push', name:'Pompes classiques', target:'4 x 12-15', sets:4, workSec:35, rest:60, note:'Mains un peu plus larges que les épaules, corps gainé du talon à la tête.' },
    'push-diamant': { cat:'push', name:'Pompes diamant', target:'3 x 10-12', sets:3, workSec:30, rest:75, note:'Mains jointes sous le sternum, coudes proches du corps : cible les triceps.' },
    'push-declinees': { cat:'push', name:'Pompes déclinées', target:'3 x 10-12', sets:3, workSec:30, rest:60, note:'Pieds surélevés sur une chaise ou un canapé : cible le haut des pectoraux et les épaules.' },
    'push-pike': { cat:'push', name:'Pike push-ups', target:'3 x 8-10', sets:3, workSec:25, rest:75, note:'Fesses hautes, corps en V inversé : cible les épaules.' },
    'push-dips': { cat:'push', name:'Dips entre deux chaises', target:'3 x 10-12', sets:3, workSec:30, rest:75, note:'Mains sur les bords, descendre lentement : cible triceps et bas des pectoraux.' },
    'push-archer': { cat:'push', name:'Pompes archer', target:'3 x 6-8/côté', sets:3, workSec:35, rest:75, note:'Un bras tendu sur le côté, l’autre plié : plus de charge sur un seul côté.' },
    'push-explosive': { cat:'push', name:'Pompes explosives', target:'3 x 8', sets:3, workSec:20, rest:90, note:'Pousser fort pour décoller les mains du sol : travaille la puissance.' },
    'push-gainage': { cat:'push', name:'Planche haute → pompe', target:'3 x 8', sets:3, workSec:25, rest:60, note:'Alterner appui coudes/mains en gainage : gaine et pousse en même temps.' },

    // -------- PULL : dos, biceps --------
    'pull-pronation': { cat:'pull', name:'Tractions pronation', target:'4 x max', sets:4, workSec:20, rest:90, note:'Prise large, paumes vers l’avant : cible le grand dorsal.' },
    'pull-supination': { cat:'pull', name:'Tractions supination', target:'3 x max', sets:3, workSec:20, rest:90, note:'Prise étroite, paumes vers soi : sollicite plus les biceps.' },
    'pull-australienne': { cat:'pull', name:'Tractions australiennes', target:'3 x 12', sets:3, workSec:30, rest:60, note:'Corps incliné sous une barre basse ou une table solide : tire la poitrine vers l’appui.' },
    'pull-suspension': { cat:'pull', name:'Suspension à la barre', target:'3 x 30-45s', sets:3, workSec:40, rest:60, note:'Se suspendre bras tendus, épaules engagées : renforce la préhension.' },
    'pull-negatives': { cat:'pull', name:'Tractions négatives', target:'3 x 5', sets:3, workSec:25, rest:90, note:'Monter avec appui (chaise ou saut), redescendre le plus lentement possible.' },
    'pull-serviette': { cat:'pull', name:'Rowing serviette de porte', target:'3 x 12', sets:3, workSec:30, rest:60, note:'Serviette autour d’une porte solide entrouverte : tirer le buste vers la porte.' },
    'pull-superman': { cat:'pull', name:'Superman', target:'3 x 15', sets:3, workSec:30, rest:45, note:'Allongé sur le ventre, lever bras et jambes ensemble : gaine le bas du dos.' },
    'pull-curl': { cat:'pull', name:'Curl isométrique serviette', target:'3 x 10', sets:3, workSec:25, rest:45, note:'Tirer sur une serviette pliée en deux avec les deux mains : contraction des biceps.' },

    // -------- LEGS : jambes, fessiers, gainage --------
    'legs-squat': { cat:'legs', name:'Squats poids du corps', target:'4 x 15-20', sets:4, workSec:40, rest:60, note:'Descendre hanches sous les genoux, dos droit.' },
    'legs-fentes': { cat:'legs', name:'Fentes avant alternées', target:'3 x 12/jambe', sets:3, workSec:40, rest:60, note:'Grand pas en avant, genou arrière frôle le sol.' },
    'legs-bulgare': { cat:'legs', name:'Squats bulgares', target:'3 x 10/jambe', sets:3, workSec:40, rest:75, note:'Pied arrière surélevé sur une chaise, descendre sur la jambe avant.' },
    'legs-hipthrust': { cat:'legs', name:'Hip thrust au sol', target:'3 x 15', sets:3, workSec:30, rest:60, note:'Épaules au sol, pousser les hanches vers le haut, serrer les fessiers.' },
    'legs-mollets': { cat:'legs', name:'Mollets debout', target:'3 x 20', sets:3, workSec:30, rest:45, note:'Monter sur la pointe des pieds, contrôler la descente.' },
    'legs-chaise': { cat:'legs', name:'Chaise contre le mur', target:'3 x 40-60s', sets:3, workSec:50, rest:60, note:'Dos au mur, cuisses parallèles au sol, tenir la position.' },
    'legs-planche': { cat:'legs', name:'Gainage planche', target:'3 x 45s', sets:3, workSec:45, rest:45, note:'Corps aligné du talon à la tête, appui sur les avant-bras.' },
    'legs-releves': { cat:'legs', name:'Relevés de jambes suspendu', target:'3 x 10-12', sets:3, workSec:30, rest:60, note:'Suspendu à la barre, monter les jambes tendues ou pliées vers la poitrine.' }
  };

  var POOL = { push:[], pull:[], legs:[] };
  Object.keys(EXERCISES).forEach(function(id){ POOL[EXERCISES[id].cat].push(id); });
  var PICK_N = 5;

  var WARMUP = [
    { id:'w1', text:'Rotations des bras et des épaules', note:'30 secondes' },
    { id:'w2', text:'Rotations des hanches et des chevilles', note:'30 secondes' },
    { id:'w3', text:'Jumping jacks', note:'30 secondes' },
    { id:'w4', text:'Squats à vide, lents', note:'10 répétitions' },
    { id:'w5', text:'Gainage planche léger', note:'20 secondes' }
  ];

  var COOLDOWN = {
    push: [
      { id:'cp1', text:'Étirement pectoraux contre un mur', note:'30 secondes par côté' },
      { id:'cp2', text:'Étirement triceps, bras au-dessus de la tête', note:'30 secondes par côté' },
      { id:'cp3', text:'Étirement épaules, bras croisé devant', note:'30 secondes par côté' }
    ],
    pull: [
      { id:'cu1', text:'Étirement dorsaux, bras tendus vers l’avant', note:'30 secondes' },
      { id:'cu2', text:'Étirement biceps, bras tendu contre un mur', note:'30 secondes par côté' },
      { id:'cu3', text:'Chat-vache pour le dos', note:'8 répétitions' }
    ],
    legs: [
      { id:'cl1', text:'Étirement quadriceps debout', note:'30 secondes par côté' },
      { id:'cl2', text:'Étirement ischios, jambe tendue', note:'30 secondes par côté' },
      { id:'cl3', text:'Étirement mollets contre un mur', note:'30 secondes par côté' },
      { id:'cl4', text:'Posture de l’enfant', note:'30 secondes' }
    ]
  };

  function esc(s){ return String(s); }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function pickN(cat, n){ return shuffle(POOL[cat]).slice(0, n); }

  var WARMUP_SEC = 300;
  function estimateSeconds(cat, ids){
    var total = WARMUP_SEC;
    ids.forEach(function(id){
      var ex = EXERCISES[id];
      total += ex.sets * ex.workSec + ex.sets * ex.rest;
    });
    total += COOLDOWN[cat].length * 45;
    return total;
  }
  function estimateLabel(cat, ids){
    var min = Math.round(estimateSeconds(cat, ids) / 60 / 5) * 5;
    return '~'+Math.max(min, 5)+' min';
  }

  function weekKey(d){
    d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - day);
    var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    var absoluteWeek = Math.floor(d.getTime() / (7*86400000));
    return { key: d.getUTCFullYear()+'-W'+weekNo, absoluteWeek: absoluteWeek };
  }

  var ROTATIONS = [
    ['push','pull','legs','push'],
    ['push','pull','legs','pull'],
    ['push','pull','legs','legs']
  ];

  function categoriesForWeek(absoluteWeek){
    return ROTATIONS[((absoluteWeek % 3) + 3) % 3];
  }

  function drawWeek(cats){
    var picks = {};
    ['s1','s2','s3','s4'].forEach(function(slot, i){ picks[slot] = pickN(cats[i], PICK_N); });
    return picks;
  }

  // ---------- state ----------
  var STORAGE_KEY = 'sportbox-v1';
  var state = { tab:'poids', checks:{}, logs:{}, prevLogs:{}, weights:[], categories:null, picks:null, weekKey:null };
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object'){
        state.tab = parsed.tab || 'poids';
        state.checks = parsed.checks || {};
        state.logs = parsed.logs || {};
        state.prevLogs = parsed.prevLogs || {};
        state.weights = Array.isArray(parsed.weights) ? parsed.weights : [];
        state.categories = parsed.categories || null;
        state.picks = parsed.picks || null;
        state.weekKey = parsed.weekKey || null;
      }
    }
  }catch(e){}

  var wk = weekKey(new Date());
  if(state.weekKey !== wk.key || !state.picks || !state.categories){
    state.prevLogs = state.logs || {};
    state.logs = {};
    state.checks = {};
    state.categories = categoriesForWeek(wk.absoluteWeek);
    state.picks = drawWeek(state.categories);
    state.weekKey = wk.key;
  }

  function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

  function itemRow(prefix, id, text, note){
    return '<label class="item"><input type="checkbox" data-id="'+prefix+'-'+id+'">' +
      '<span class="box">'+CHECK_SVG+'</span>' +
      '<span class="text">'+esc(text)+(note?' <span class="note">'+esc(note)+'</span>':'')+'</span></label>';
  }

  function slotLabel(i){ return 'Séance '+(i+1); }

  function notifSupported(){ return 'Notification' in window; }
  function renderNotifRow(){
    if(!notifSupported()){
      return '<div class="notif-row"><span class="notif-label">Notifications de fin de repos</span><span class="notif-label" style="color:var(--muted-2)">Non supporté sur ce navigateur</span></div>';
    }
    var status = Notification.permission;
    var label = status === 'granted' ? 'Activées ✓' : (status === 'denied' ? 'Bloquées' : 'Activer');
    var disabled = status !== 'default';
    return '<div class="notif-row"><span class="notif-label">Notifications de fin de repos</span>' +
      '<button type="button" class="swap-btn" id="notif-btn"'+(disabled?' disabled':'')+'>'+label+'</button></div>';
  }
  function bindNotif(){
    var btn = document.getElementById('notif-btn');
    if(!btn || btn.disabled) return;
    btn.addEventListener('click', function(){
      Notification.requestPermission().then(function(status){
        btn.textContent = status === 'granted' ? 'Activées ✓' : (status === 'denied' ? 'Bloquées' : 'Activer');
        if(status !== 'default') btn.disabled = true;
      });
    });
  }
  function notifyRestDone(exerciseName){
    if(navigator.vibrate){ try{ navigator.vibrate([200,100,200]); }catch(e){} }
    if(!notifSupported() || Notification.permission !== 'granted') return;
    var title = 'Repos terminé';
    var body = exerciseName ? ('Série suivante : '+exerciseName) : 'Série suivante !';
    var opts = { body: body, icon:'icons/icon-192.png', badge:'icons/icon-192.png', tag:'sportbox-rest', renotify:true };
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){
        if(reg && reg.showNotification) reg.showNotification(title, opts);
        else { try{ new Notification(title, opts); }catch(e){} }
      }).catch(function(){ try{ new Notification(title, opts); }catch(e){} });
    } else {
      try{ new Notification(title, opts); }catch(e){}
    }
  }

  function fmtDate(iso){
    var d = new Date(iso+'T00:00:00');
    var days = ['dim','lun','mar','mer','jeu','ven','sam'];
    return days[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1);
  }

  function renderPoidsPanel(){
    var html = '<div class="lineup"><h3>Cette semaine</h3><span class="sub">Rotation Push/Pull/Legs, tirée automatiquement chaque semaine</span>';
    html += '<div class="lineup-pills">';
    ['s1','s2','s3','s4'].forEach(function(slot, i){
      var cat = state.categories[i];
      var ids = state.picks[slot];
      var done = ids.every(function(id){ return !!state.checks[slot+'-ex-'+id]; });
      html += '<span class="lineup-pill'+(done?' done':'')+'"><span class="dot"></span>'+slotLabel(i)+' · '+esc(CAT_LABEL[cat])+'</span>';
    });
    html += '</div><button type="button" class="reroll-btn" id="reroll-all">Nouveau tirage</button>' + renderNotifRow() + '</div>';

    html += '<div class="section-title">Suivi du poids</div>';
    html += '<div class="weight-form"><input type="number" step="0.1" inputmode="decimal" id="weight-input" placeholder="Poids en kg"><button type="button" id="weight-add">Ajouter</button></div>';

    var sorted = state.weights.slice().sort(function(a,b){ return b.date.localeCompare(a.date) || b.id - a.id; });
    if(!sorted.length){
      html += '<div class="list"><div class="empty">Aucune pesée enregistrée pour l’instant.</div></div>';
    } else {
      html += '<div class="list">';
      sorted.forEach(function(w, i){
        var next = sorted[i+1];
        var delta = next ? (w.kg - next.kg) : 0;
        var deltaClass = delta > 0.05 ? 'up' : (delta < -0.05 ? 'down' : 'flat');
        var deltaText = next ? (delta > 0 ? '+' : '') + delta.toFixed(1)+' kg' : '—';
        html += '<div class="weight-row"><span class="weight-date">'+esc(fmtDate(w.date))+'</span><span class="weight-kg">'+w.kg.toFixed(1)+' kg</span>' +
          '<span class="weight-delta '+deltaClass+'">'+esc(deltaText)+'</span>' +
          '<button type="button" class="weight-del" data-del-weight="'+w.id+'" aria-label="Supprimer">✕</button></div>';
      });
      html += '</div>';
    }

    return '<section class="panel" id="panel-poids" data-panel="poids"><div class="week-header"><h2>Poids & semaine</h2><span class="theme" style="color:var(--muted)">Suivi simple, propre à cet appareil</span></div>'+html+'</section>';
  }

  function renderSessionPanel(slotIndex){
    var slot = 's'+(slotIndex+1);
    var cat = state.categories[slotIndex];
    var ids = state.picks[slot];
    var themeClass = 'theme-'+cat;

    var html = '<div class="week-header"><div><h2>'+slotLabel(slotIndex)+'</h2><span class="theme '+themeClass+'">'+esc(CAT_LABEL[cat])+' · '+esc(estimateLabel(cat, ids))+'</span></div>' +
      '<button type="button" class="swap-btn" data-reroll-slot="'+slot+'">Changer</button></div>';
    html += '<div class="quicknav"><a href="#'+slot+'-echauffement">Échauffement</a><a href="#'+slot+'-exercices">Exercices</a><a href="#'+slot+'-recap">Étirements</a></div>';

    html += '<div class="week-section" id="'+slot+'-echauffement">';
    html += '<div class="progress"><div class="progress-track"><div class="progress-fill fill-'+cat+'" id="fill-'+slot+'-warm"></div></div><span class="progress-label" id="label-'+slot+'-warm">0 / 0</span></div>';
    html += '<div class="section-title">Échauffement · 5 minutes</div><div class="list">';
    WARMUP.forEach(function(w){ html += itemRow(slot+'-warm', w.id, w.text, w.note); });
    html += '</div></div>';

    html += '<div class="week-section" id="'+slot+'-exercices">';
    html += '<div class="progress"><div class="progress-track"><div class="progress-fill fill-'+cat+'" id="fill-'+slot+'-ex"></div></div><span class="progress-label" id="label-'+slot+'-ex">0 / 0</span></div>';
    html += '<div class="section-title">Exercices</div><div class="callout" style="border-left-color:var(--'+cat+')"><b style="color:var(--'+cat+')">'+esc(ids.length+' exercices tirés')+'.</b> Repos indiqué entre les séries. Note tes performances pour suivre ta progression semaine après semaine.</div>';
    html += '<div class="list prep-check cat-'+cat+'">';
    ids.forEach(function(id, i){
      var ex = EXERCISES[id];
      var log = state.logs[id] || {};
      var prev = state.prevLogs[id];
      var prevText = prev ? ('Semaine dernière : '+esc(prev.reps||'—')+' reps'+(prev.weight?' · +'+esc(prev.weight)+' kg':'')) : 'Pas encore de donnée pour cet exercice.';
      html += '<div class="step" data-step-id="'+slot+'-ex-'+id+'"><div class="step-head"><span class="step-num">'+(i+1)+'</span><div class="step-body">';
      html += '<span class="step-tag">'+esc(ex.target)+'</span><p class="step-text">'+esc(ex.name)+'</p><p class="step-note">'+esc(ex.note)+'</p>';
      html += '<div class="timer" data-duration="'+ex.rest+'"><span class="timer-display">'+formatTime(ex.rest)+'</span>' +
        '<button type="button" class="timer-btn" data-action="toggle">Repos</button>' +
        '<button type="button" class="timer-btn ghost" data-action="reset">Reset</button></div>';
      html += '<div class="log-row"><label class="log-field">Reps <input type="number" min="0" inputmode="numeric" data-log="reps" data-ex="'+id+'" value="'+(log.reps!=null?log.reps:'')+'"></label>' +
        '<label class="log-field">+kg <input type="number" min="0" step="0.5" inputmode="decimal" data-log="weight" data-ex="'+id+'" value="'+(log.weight!=null?log.weight:'')+'"></label>' +
        '<span class="log-prev">'+prevText+'</span></div>';
      html += '</div><label class="step-check item" style="padding:0;border:none;"><input type="checkbox" data-id="'+slot+'-ex-'+id+'"><span class="box">'+CHECK_SVG+'</span></label>';
      html += '</div></div>';
    });
    html += '</div></div>';

    html += '<div class="week-section" id="'+slot+'-recap">';
    html += '<div class="progress"><div class="progress-track"><div class="progress-fill fill-'+cat+'" id="fill-'+slot+'-cool"></div></div><span class="progress-label" id="label-'+slot+'-cool">0 / 0</span></div>';
    html += '<div class="section-title">Étirements</div><div class="list">';
    COOLDOWN[cat].forEach(function(c){ html += itemRow(slot+'-cool', c.id, c.text, c.note); });
    html += '</div></div>';

    return '<section class="panel" id="panel-'+slot+'" data-panel="'+slot+'" hidden>'+html+'</section>';
  }

  function renderLibPanel(){
    var html = '<div class="week-header"><h2>Bibliothèque</h2><span class="theme" style="color:var(--muted)">'+Object.keys(EXERCISES).length+' exercices, poids du corps + barre de traction</span></div>';
    var activeIds = [].concat(state.picks.s1, state.picks.s2, state.picks.s3, state.picks.s4);
    ['push','pull','legs'].forEach(function(cat){
      html += '<div class="section-title stock-cat">'+esc(CAT_LABEL[cat])+'</div><div class="lib-list">';
      POOL[cat].forEach(function(id){
        var ex = EXERCISES[id];
        var active = activeIds.indexOf(id) !== -1;
        html += '<div class="lib-item'+(active?' active':'')+'"><div class="lib-main"><div class="lib-name">'+esc(ex.name)+'</div><div class="lib-target">'+esc(ex.target)+'</div><div class="lib-note">'+esc(ex.note)+'</div></div>';
        if(active) html += '<span class="lib-badge">Au programme</span>';
        html += '</div>';
      });
      html += '</div>';
    });
    return '<section class="panel" id="panel-lib" data-panel="lib" hidden>'+html+'</section>';
  }

  // ---------- render + bind ----------
  var app = document.getElementById('app');

  function renderApp(){
    var parts = [renderPoidsPanel()];
    for(var i=0;i<4;i++) parts.push(renderSessionPanel(i));
    parts.push(renderLibPanel());
    app.innerHTML = parts.join('');
    bindAll();
    applyTab(state.tab);
  }

  function updateProgress(fillId, labelId, checked, total){
    var fill = document.getElementById(fillId);
    var label = document.getElementById(labelId);
    var pct = total ? Math.round((checked/total)*100) : 0;
    if(fill) fill.style.width = pct + '%';
    if(label) label.textContent = checked + ' / ' + total;
  }
  function refreshGroup(selector, fillId, labelId){
    var boxes = document.querySelectorAll(selector);
    var checked = 0;
    boxes.forEach(function(b){ if(b.checked) checked++; });
    updateProgress(fillId, labelId, checked, boxes.length);
  }
  function refreshAllProgress(){
    ['s1','s2','s3','s4'].forEach(function(slot){
      refreshGroup('#'+slot+'-echauffement input[type="checkbox"]', 'fill-'+slot+'-warm', 'label-'+slot+'-warm');
      refreshGroup('#'+slot+'-exercices .step-check input[type="checkbox"]', 'fill-'+slot+'-ex', 'label-'+slot+'-ex');
      refreshGroup('#'+slot+'-recap input[type="checkbox"]', 'fill-'+slot+'-cool', 'label-'+slot+'-cool');
    });
    var pills = document.querySelectorAll('.lineup-pill');
    ['s1','s2','s3','s4'].forEach(function(slot, i){
      var ids = state.picks[slot];
      var done = ids.every(function(id){ return !!state.checks[slot+'-ex-'+id]; });
      if(pills[i]) pills[i].classList.toggle('done', done);
    });
  }

  function clearAllChecks(){
    state.checks = {};
    document.querySelectorAll('input[type="checkbox"][data-id]').forEach(function(i){ i.checked = false; });
    document.querySelectorAll('.step').forEach(function(s){ s.classList.remove('done'); });
  }

  function bindCheckboxes(){
    document.querySelectorAll('input[type="checkbox"][data-id]').forEach(function(input){
      var id = input.dataset.id;
      input.checked = !!state.checks[id];
      var stepEl = input.closest('.step');
      if(input.checked && stepEl) stepEl.classList.add('done');
      input.addEventListener('change', function(){
        state.checks[this.dataset.id] = this.checked;
        var se = this.closest('.step');
        if(se) se.classList.toggle('done', this.checked);
        saveState();
        refreshAllProgress();
      });
    });
    refreshAllProgress();
  }

  function bindLogInputs(){
    document.querySelectorAll('[data-log]').forEach(function(input){
      input.addEventListener('change', function(){
        var exId = this.dataset.ex;
        var field = this.dataset.log;
        state.logs[exId] = state.logs[exId] || {};
        state.logs[exId][field] = this.value === '' ? null : Number(this.value);
        saveState();
      });
    });
  }

  function bindWeightForm(){
    var addBtn = document.getElementById('weight-add');
    var input = document.getElementById('weight-input');
    if(addBtn){
      addBtn.addEventListener('click', function(){
        var val = parseFloat(input.value);
        if(!val || val <= 0) return;
        var today = new Date();
        var iso = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
        state.weights.push({ id: Date.now(), date: iso, kg: val });
        saveState();
        renderApp();
      });
    }
    document.querySelectorAll('[data-del-weight]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = Number(this.dataset.delWeight);
        state.weights = state.weights.filter(function(w){ return w.id !== id; });
        saveState();
        renderApp();
      });
    });
  }

  function bindTabs(){
    var tabBtns = document.querySelectorAll('.tab-btn');
    tabBtns.forEach(function(b){ b.addEventListener('click', function(){ applyTab(b.dataset.tab); state.tab = b.dataset.tab; saveState(); }); });
  }
  function applyTab(name){
    document.querySelectorAll('.panel').forEach(function(p){ p.hidden = (p.dataset.panel !== name); });
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.setAttribute('aria-selected', b.dataset.tab === name ? 'true' : 'false'); });
  }

  function bindReroll(){
    var btn = document.getElementById('reroll-all');
    if(btn){
      btn.addEventListener('click', function(){
        state.prevLogs = state.logs;
        state.logs = {};
        state.checks = {};
        state.picks = drawWeek(state.categories);
        saveState();
        renderApp();
      });
    }
    document.querySelectorAll('[data-reroll-slot]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var slot = this.dataset.rerollSlot;
        var idx = Number(slot.slice(1)) - 1;
        var cat = state.categories[idx];
        state.picks[slot] = pickN(cat, PICK_N);
        Object.keys(state.checks).forEach(function(k){ if(k.indexOf(slot+'-') === 0) delete state.checks[k]; });
        saveState();
        renderApp();
      });
    });
  }

  function bindResetOpen(){
    var resetZone = document.getElementById('reset-zone');
    var btn = document.getElementById('reset-open');
    if(!btn) return;
    btn.addEventListener('click', function(){
      resetZone.innerHTML = '<div class="reset-confirm">Tout décocher ?<button type="button" id="reset-yes" class="danger">Oui</button><button type="button" id="reset-no">Annuler</button></div>';
      document.getElementById('reset-yes').addEventListener('click', function(){
        clearAllChecks();
        saveState();
        refreshAllProgress();
        resetZone.innerHTML = '<button type="button" class="reset-btn" id="reset-open">Réinitialiser</button>';
        bindResetOpen();
      });
      document.getElementById('reset-no').addEventListener('click', function(){
        resetZone.innerHTML = '<button type="button" class="reset-btn" id="reset-open">Réinitialiser</button>';
        bindResetOpen();
      });
    });
  }

  function beep(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      [0, 0.18].forEach(function(delay){
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.frequency.value = 880;
        o.connect(g); g.connect(ctx.destination);
        var t0 = ctx.currentTime + delay;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
        o.start(t0); o.stop(t0 + 0.2);
      });
    }catch(e){}
  }
  function formatTime(sec){
    var m = Math.floor(sec/60); var s = sec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function bindTimers(){
    document.querySelectorAll('.timer[data-duration]').forEach(function(el){
      var duration = parseInt(el.dataset.duration, 10) || 0;
      var remaining = duration;
      var display = el.querySelector('.timer-display');
      var toggleBtn = el.querySelector('[data-action="toggle"]');
      var resetBtn = el.querySelector('[data-action="reset"]');
      var intervalId = null;
      function render(){ display.textContent = formatTime(Math.max(remaining,0)); }
      render();
      function tick(){
        remaining -= 1;
        if(remaining <= 0){
          remaining = 0; render(); stop();
          el.classList.add('done'); toggleBtn.textContent = 'Repos'; beep();
          var stepEl = el.closest('.step');
          var nameEl = stepEl && stepEl.querySelector('.step-text');
          notifyRestDone(nameEl ? nameEl.textContent : null);
          return;
        }
        render();
      }
      function start(){ intervalId = setInterval(tick, 1000); el.classList.add('running'); el.classList.remove('done'); toggleBtn.textContent = 'Pause'; }
      function stop(){ if(intervalId){ clearInterval(intervalId); intervalId = null; } el.classList.remove('running'); }
      toggleBtn.addEventListener('click', function(){
        if(intervalId){ stop(); toggleBtn.textContent = 'Repos'; }
        else { if(remaining <= 0) remaining = duration; start(); }
      });
      resetBtn.addEventListener('click', function(){ stop(); remaining = duration; el.classList.remove('done'); toggleBtn.textContent = 'Repos'; render(); });
    });
  }

  function bindAll(){
    bindCheckboxes();
    bindTabs();
    bindReroll();
    bindTimers();
    bindLogInputs();
    bindWeightForm();
    bindNotif();
  }

  renderApp();
  bindResetOpen();
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
